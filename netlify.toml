# Netlify Build Configuration for Echo AI Project
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Redirect rules for Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Handle authentication callbacks
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' *.replicate.delivery *.pollinations.ai *.volces.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: *.replicate.delivery *.pollinations.ai *.volces.com https:; media-src 'self'; font-src 'self' data:; connect-src 'self' *.replicate.delivery api.deepseek.com doubao-api.coze.cn *.volces.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Cache control for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/image"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/@prisma/client/**/*"]

# Prisma schema setup
[[plugins]]
  package = "@netlify/plugin-prisma"

# Environment variables validation
[context.production.environment]
  NEXTAUTH_URL = { required = true }
  DATABASE_URL = { required = true }
  NEXTAUTH_SECRET = { required = true }
  DEEPSEEK_API_KEY = { required = true }
  DOUBAO_API_KEY = { required = true }
  EMAIL_SERVER_HOST = { required = true }
  EMAIL_SERVER_PORT = { required = true }
  EMAIL_SERVER_USER = { required = true }
  EMAIL_SERVER_PASSWORD = { required = true }
  EMAIL_FROM = { required = true }